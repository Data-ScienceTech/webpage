server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------
    # Redirects (legacy corporate site -> Agentic Governance site)
    # ---------------------------------------------------------------

    # Retired product pages -> home
    rewrite ^/en/force-field/?$           /en/open-forcefield permanent;
    rewrite ^/en/agentic-security/?$      /en/ permanent;
    rewrite ^/en/architecture/?$          /en/ permanent;
    rewrite ^/en/security/?$              /en/ permanent;
    rewrite ^/en/why-runtime-authority/?$ /en/ permanent;
    rewrite ^/en/signup/?$                /en/ permanent;
    rewrite ^/en/legal/?$                 /en/ permanent;
    rewrite ^/en/terms/?$                 /en/ permanent;
    rewrite ^/en/terms-of-use/?$          /en/ permanent;
    rewrite ^/en/acceptable-use/?$        /en/ permanent;
    rewrite ^/en/scanner-terms/?$         /en/ permanent;
    rewrite ^/en/scanner-privacy/?$       /en/privacy-policy permanent;
    rewrite ^/en/privacy/?$               /en/privacy-policy permanent;
    rewrite ^/en/python-sdk/?$            /en/open-forcefield permanent;

    rewrite ^/fr/force-field/?$                /fr/open-forcefield permanent;
    rewrite ^/fr/agentic-security/?$           /fr/ permanent;
    rewrite ^/fr/architecture/?$               /fr/ permanent;
    rewrite ^/fr/securite/?$                   /fr/ permanent;
    rewrite ^/fr/pourquoi-autorite-runtime/?$  /fr/ permanent;
    rewrite ^/fr/inscription/?$                /fr/ permanent;
    rewrite ^/fr/juridique/?$                  /fr/ permanent;
    rewrite ^/fr/conditions/?$                 /fr/ permanent;
    rewrite ^/fr/conditions-dutilisation/?$    /fr/ permanent;
    rewrite ^/fr/conditions-scanner/?$         /fr/ permanent;
    rewrite ^/fr/utilisation-acceptable/?$     /fr/ permanent;
    rewrite ^/fr/confidentialite-scanner/?$    /fr/politique-de-confidentialite permanent;
    rewrite ^/fr/confidentialite/?$            /fr/politique-de-confidentialite permanent;
    rewrite ^/fr/python-sdk/?$                 /fr/open-forcefield permanent;

    # Locale-prefix shortcuts (unprefixed URLs -> EN)
    rewrite ^/open-forcefield$          /en/open-forcefield permanent;
    rewrite ^/benchmarks$               /en/benchmarks permanent;
    rewrite ^/force-field$              /en/open-forcefield permanent;
    rewrite ^/agentic-security$         /en/ permanent;
    rewrite ^/signup$                   /en/ permanent;
    rewrite ^/python-sdk$               /en/open-forcefield permanent;

    # Contact form proxy -> tenant manager (retained for hosted demo compat)
    location = /v1/contact-form {
        proxy_pass ${TENANT_MANAGER_URL}/v1/contact-form;
        proxy_set_header Host ${TENANT_MANAGER_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type "application/json";
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_ssl_server_name on;
    }

    # ---------------------------------------------------------------
    # Static asset caching (Astro hashed filenames)
    # ---------------------------------------------------------------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------
    # Default: serve static files, fallback to locale index
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # Disable server version disclosure
    server_tokens off;
}
