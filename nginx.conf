server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------------
    # Redirects (migrated from Netlify _redirects -- forced 301s)
    # ---------------------------------------------------------------

    # EN product pages -> forcefield.datasciencetech.ca
    rewrite ^/en/python-sdk/?$          https://forcefield.datasciencetech.ca/python-sdk permanent;
    rewrite ^/en/benchmarks/?$          https://forcefield.datasciencetech.ca/benchmarks permanent;
    rewrite ^/en/force-field/?$         https://forcefield.datasciencetech.ca/ permanent;
    rewrite ^/en/agentic-security/?$    https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/en/architecture/?$        https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/en/security/?$            https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/en/why-runtime-authority/?$ https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/en/signup/?$              https://forcefield.datasciencetech.ca/signup permanent;

    # FR product pages -> forcefield.datasciencetech.ca
    rewrite ^/fr/python-sdk/?$          https://forcefield.datasciencetech.ca/python-sdk permanent;
    rewrite ^/fr/benchmarks/?$          https://forcefield.datasciencetech.ca/benchmarks permanent;
    rewrite ^/fr/force-field/?$         https://forcefield.datasciencetech.ca/ permanent;
    rewrite ^/fr/agentic-security/?$    https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/fr/architecture/?$        https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/fr/securite/?$            https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/fr/pourquoi-autorite-runtime/?$ https://forcefield.datasciencetech.ca/docs permanent;
    rewrite ^/fr/inscription/?$         https://forcefield.datasciencetech.ca/signup permanent;

    # Locale-prefix shortcuts (from netlify.toml)
    rewrite ^/force-field$              /en/force-field permanent;
    rewrite ^/agentic-security$         /en/agentic-security permanent;
    rewrite ^/signup$                   /en/signup permanent;

    # Contact form proxy -> tenant manager
    location = /v1/contact-form {
        proxy_pass ${TENANT_MANAGER_URL}/v1/contact-form;
        proxy_set_header Host ${TENANT_MANAGER_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type "application/json";
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_ssl_server_name on;
    }

    # ---------------------------------------------------------------
    # Static asset caching (Astro hashed filenames)
    # ---------------------------------------------------------------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------------------------------------------------------------
    # Default: serve static files, fallback to locale index
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # Disable server version disclosure
    server_tokens off;
}
